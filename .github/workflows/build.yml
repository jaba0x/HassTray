name: build

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Work out version
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Test and build
        run: scripts/build-mac.sh "${{ steps.ver.outputs.version }}"
      - name: Zip the app
        run: cd build/bin && ditto -c -k --keepParent HassTray.app "HassTray-${{ steps.ver.outputs.version }}-macos-universal.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: HassTray-macos
          path: build/bin/*.zip
      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/bin/*.zip --title "HassTray ${{ steps.ver.outputs.version }}" --generate-notes
